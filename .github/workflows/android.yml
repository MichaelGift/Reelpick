name: Android CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit test and lint
        env:
          # Optional: the builds succeed without them; each app shows a "missing key" state.
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        # Builds both apps; :core:recommend is a plain JVM module, so its tests run under `test`.
        run: ./gradlew assembleDebug testDebugUnitTest :core:recommend:test lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            games/build/reports
            core/recommend/build/reports
